<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vista</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">◈</span><span class="brand-name">Vista</span></a>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="side-end">
      <div>Read-only view of Spark</div>
      <div id="version"></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="topTitle">Overview</div>
      <div class="grow"></div>
      <span class="updated" id="updated" aria-live="polite"></span>
      <label class="sr-only" for="range">Time range</label>
      <select id="range" class="select">
        <option value="1h">Last hour</option>
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
      </select>
      <button class="btn btn-icon" id="refresh" type="button" title="Refresh now" aria-label="Refresh now">⟳</button>
    </header>
    <div class="content" id="page" tabindex="-1"></div>
  </main>
</div>
<div class="drawer-backdrop" id="drawerBackdrop" hidden>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerName">
    <div class="drawer-title">
      <div><div class="eyebrow">Project</div><h2 id="drawerName"></h2></div>
      <button class="close" id="drawerClose" type="button" aria-label="Close">×</button>
    </div>
    <div id="drawerContent"></div>
  </aside>
</div>
<noscript><p class="noscript">Vista needs JavaScript to show the dashboard.</p></noscript>
</body>
</html>
